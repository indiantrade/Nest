<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Vikas Laddha — Stock Market Learning &amp; Chart Analysis Community</title>
  <meta name="description" content="Join Vikas Laddha's free educational Telegram community to learn price action, chart patterns, risk management, and market psychology." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-primary: #070b14;
      --bg-secondary: #0d1424;
      --card-bg: rgba(17, 25, 44, 0.78);
      --card-border: rgba(255, 255, 255, 0.09);
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent-green: #10b981;
      --accent-green-glow: rgba(16, 185, 129, 0.32);
      --telegram-blue: #229ED9;
      --telegram-blue-dark: #1b87ba;
      --telegram-glow: rgba(34, 158, 217, 0.42);
      --gold-badge: #f59e0b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-primary);
      background-image:
        radial-gradient(circle at 50% -10%, rgba(34, 158, 217, 0.18), transparent 55%),
        radial-gradient(circle at 85% 35%, rgba(16, 185, 129, 0.08), transparent 45%),
        linear-gradient(180deg, #070b14 0%, #0b1120 100%);
      color: var(--text-primary);
      line-height: 1.55;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Subtle Candlestick / Chart Grid Background */
    .bg-grid {
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.025) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.025) 1px, transparent 1px);
      background-size: 36px 36px;
      mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 85%);
      -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.8), transparent 85%);
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 20px 16px 36px;
    }

    /* Top Educational Pill */
    .top-pill-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 18px;
    }

    .top-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(16, 185, 129, 0.12);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #6ee7b7;
      font-size: 11.5px;
      font-weight: 600;
      letter-spacing: 0.4px;
      padding: 6px 13px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulseDot 1.8s infinite ease-in-out;
    }

    @keyframes pulseDot {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.55; }
    }

    /* Hero Card */
    .hero-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 26px 20px 24px;
      text-align: center;
      box-shadow: 0 20px 45px -15px rgba(0, 0, 0, 0.7);
      margin-bottom: 18px;
    }

    /* Profile Logo */
    .avatar-wrapper {
      position: relative;
      width: 104px;
      height: 104px;
      margin: 0 auto 14px;
    }

    .avatar-ring {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #229ED9, #10b981, #229ED9);
      padding: 3px;
      box-shadow: 0 0 24px rgba(34, 158, 217, 0.35);
    }

    .avatar-img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #0b1120;
      display: block;
      background-color: #111827;
    }

    .verified-badge {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 26px;
      height: 26px;
      background: #229ED9;
      border: 2.5px solid #0b1120;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    .channel-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      color: #ffffff;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .channel-subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #38bdf8;
      margin-bottom: 14px;
      letter-spacing: 0.2px;
    }

    .hero-headline {
      font-size: 18px;
      font-weight: 700;
      line-height: 1.38;
      color: #f1f5f9;
      margin-bottom: 10px;
    }

    .hero-headline span {
      color: #34d399;
    }

    .hero-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-bottom: 20px;
      padding: 0 4px;
    }

    /* Primary Single CTA Button (Clean for Meta Event Setup Tool) */
    .cta-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 16px 20px;

      color: #ffffff;
